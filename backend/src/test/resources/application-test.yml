spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    # Test-specific H2-compatible migrations live under test-resources/db/h2-migration.
    # Using a distinct path avoids the "found more than one migration with version N" error
    # that occurs when both main and test resources appear on the classpath.
    locations: classpath:db/h2-migration
    baseline-on-migrate: false

chores:
  jwt:
    secret: VGhpcy1pcy1hLWxvY2FsLWRldi1zZWNyZXQtcGxlYXNlLW92ZXJyaWRlLWluLXByb2Q=
    ttl-hours: 1
  admin:
    username: admin
    password: adminpass
    display-name: Admin
