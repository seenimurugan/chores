spring:
  application:
    name: chores
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chores}
    username: ${SPRING_DATASOURCE_USERNAME:chores}
    password: ${SPRING_DATASOURCE_PASSWORD:chores}
    hikari:
      # Wait up to 60s for Postgres to be reachable on startup before failing
      # the boot. Mitigates intermittent kube-dns resolution at pod start.
      initialization-fail-timeout: 60000
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

chores:
  jwt:
    # 256-bit base64 secret. Override via CHORES_JWT_SECRET. Default for local dev only.
    secret: ${CHORES_JWT_SECRET:VGhpcy1pcy1hLWxvY2FsLWRldi1zZWNyZXQtcGxlYXNlLW92ZXJyaWRlLWluLXByb2Q=}
    ttl-hours: 720
  admin:
    # Bootstrap admin (created on first run if no admin exists). Override in prod.
    username: ${CHORES_ADMIN_USERNAME:admin}
    password: ${CHORES_ADMIN_PASSWORD:changeme}
    display-name: ${CHORES_ADMIN_DISPLAY_NAME:Admin}
  email:
    # From address for outbound reminder emails. Falls back to SMTP_USERNAME if blank.
    from: ${SMTP_FROM:}
    from-name: ${SMTP_FROM_NAME:Chores}
  telegram:
    # Telegram bot token — mapped from chores-backend-secret key TELEGRAM_BOT_TOKEN.
    bot-token: ${TELEGRAM_BOT_TOKEN:}
  reminder:
    # Time of day (kid's local TZ) from which at-risk reminders may be sent. Default: 06:00.
    send-time: ${CHORES_REMINDER_SEND_TIME:06:00}
    # How often to check for at-risk chores. Default: 15 minutes = 900000 ms.
    check-interval-ms: ${CHORES_REMINDER_CHECK_INTERVAL_MS:900000}

logging:
  level:
    org.springframework.security: INFO
    com.nila.chores: INFO
